<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CNS · Material Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#FAFAF9; --surface:#FFFFFF; --surface2:#F5F5F4;
    --line:#E7E5E4; --line2:#F0EFEE;
    --ink:#1C1917; --ink2:#44403C; --muted:#78716C; --faint:#A8A29E;
    --teal:#02505C; --teal2:#0A6B78; --teal-bg:#EBF2F3;
    --amber:#B45309; --amber-bg:#FDF4E7;
    --red:#B42318; --red-bg:#FDF0EE;
    --green:#15803D; --green-bg:#EFF6F1;
    --nav:#0F1B1E; --navtx:#93A7AB;
    --sh:0 1px 2px rgba(28,25,23,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;min-height:100vh;}

  /* ---- left nav ---- */
  nav{width:186px;background:var(--nav);color:var(--navtx);flex:none;display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;padding:16px 10px;}
  .logo{display:flex;align-items:center;gap:9px;padding:0 8px 16px;}
  .logo .m{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.13);color:#fff;
    display:grid;place-items:center;font-size:10px;font-weight:700;}
  .logo .t{color:#fff;font-size:13px;font-weight:600;letter-spacing:-.01em;}
  .navi{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:6px;
    cursor:pointer;font-size:12.5px;font-weight:500;transition:background .12s,color .12s;margin-bottom:1px;}
  .navi:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navi.on{background:rgba(255,255,255,.11);color:#fff;font-weight:600;}
  .navi .c{background:var(--amber);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:700;}
  .navsec{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#5F7378;padding:14px 9px 6px;font-weight:700;}
  .who{margin-top:auto;padding:10px 9px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;}
  .who b{color:#fff;display:block;font-size:12px;}
  .who .r{color:#5F7378;text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;font-weight:700;margin-top:2px;}

  /* ---- main ---- */
  main{margin-left:186px;flex:1;min-width:0;}
  .top{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;height:52px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
  .top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;}
  .top .sub{font-size:11.5px;color:var(--muted);margin-left:10px;}
  .wrap{padding:20px 24px 70px;max-width:1320px;}

  .sitefilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .sf{padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
    font-size:12px;color:var(--ink2);cursor:pointer;transition:.12s;font-weight:500;}
  .sf:hover{border-color:var(--faint);}
  .sf.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
  .sf .b{font-size:10px;margin-left:5px;opacity:.8;}

  .grid{display:grid;gap:14px;margin-bottom:18px;}
  .g5{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));}
  .g2{grid-template-columns:1fr 1fr;}
  .g21{grid-template-columns:1.6fr 1fr;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);}
  .card>h3{margin:0;padding:12px 15px 0;font-size:13px;font-weight:650;}
  .card>p.s{margin:2px 0 0;padding:0 15px;font-size:11.5px;color:var(--muted);}
  .card>.body{padding:12px 15px 14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--sh);}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px;}
  .stat .v{font-size:20px;font-weight:680;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;}
  .stat .f{font-size:10.5px;color:var(--faint);margin-top:3px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);}
  th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;
    background:var(--surface2);white-space:nowrap;}
  tbody tr:hover{background:var(--surface2);}
  tbody tr:last-child td{border-bottom:none;}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  .cr{cursor:pointer;}
  .empty{color:var(--muted);padding:20px 0;text-align:center;font-size:12.5px;}

  .b{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:650;white-space:nowrap;}
  .b-teal{background:var(--teal-bg);color:var(--teal);} .b-amber{background:var(--amber-bg);color:var(--amber);}
  .b-red{background:var(--red-bg);color:var(--red);} .b-green{background:var(--green-bg);color:var(--green);}
  .b-grey{background:var(--surface2);color:var(--ink2);}

  button{font:inherit;font-size:12px;font-weight:550;border:none;border-radius:6px;padding:6px 11px;
    background:var(--teal);color:#fff;cursor:pointer;transition:background .12s;}
  button:hover{background:var(--teal2);}
  button.g{background:var(--surface);color:var(--ink2);border:1px solid var(--line);}
  button.g:hover{background:var(--surface2);}
  button.ok{background:var(--green);} button.ok:hover{background:#166534;}
  button.sm{padding:3px 8px;font-size:11px;}
  a.lnk{color:var(--teal);text-decoration:none;border-bottom:1px solid var(--teal-bg);cursor:pointer;}
  a.lnk:hover{border-color:var(--teal);}

  input,select,textarea{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--line);
    background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-bg);}
  label{display:block;font-size:10.5px;color:var(--muted);margin:0 0 4px;font-weight:600;}
  .fld{margin-bottom:11px;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px;}
  .bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;}
  .bar span{display:block;height:100%;border-radius:3px;}
  .pie{position:relative;height:190px;}
  .note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:10px;}
  .note b{color:var(--ink2);}

  .fitem{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);}
  .fitem:last-child{border-bottom:none;}
  .fitem b{font-size:12.5px;font-weight:600;display:block;}
  .fitem .fs{font-size:11px;color:var(--muted);margin-top:1px;}
  .fthumb{width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line);
    display:block;background:var(--surface2);transition:transform .12s;}
  .fthumb:hover{transform:scale(1.03);}
  .fdoc{width:62px;height:62px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);
    display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;}
  .drop{border:1px dashed var(--line);border-radius:7px;padding:11px;background:var(--surface2);margin-top:12px;}

  .scrim{position:fixed;inset:0;background:rgba(28,25,23,.3);opacity:0;pointer-events:none;transition:.22s;z-index:80;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .over{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--surface);
    box-shadow:-8px 0 28px rgba(28,25,23,.1);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    z-index:90;display:flex;flex-direction:column;}
  .over.on{transform:translateX(0);}
  .oh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .oh h4{margin:0 0 2px;font-size:15px;font-weight:650;}
  .oh .s{font-size:11.5px;color:var(--muted);}
  .ob{padding:18px 20px;overflow:auto;flex:1;}
  .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}
  .x:hover{color:var(--ink);background:none;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;
    border-radius:7px;font-size:12.5px;display:none;z-index:120;}
  .login{max-width:380px;margin:90px auto;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:30px;box-shadow:var(--sh);}
  .login h2{margin:0 0 4px;font-size:18px;color:var(--teal);}
  .ro{background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;
    font-size:11.5px;color:var(--muted);}
  @media(max-width:900px){nav{display:none;}main{margin-left:0;}.g2,.g21{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loginScreen" class="login" style="display:none;">
  <h2>Champs &amp; Stars</h2>
  <p style="color:var(--muted);margin:0 0 18px;">Material control. Enter your work email for a one-time sign-in link.</p>
  <div class="fld"><label>Email</label><input id="loginEmail" type="email" placeholder="you@cnsmea.com" /></div>
  <button onclick="sendLink()" style="width:100%;">Send sign-in link</button>
  <div id="otpBlock" style="display:none;margin-top:12px;">
    <div class="fld"><label>6-digit code</label><input id="otpCode" inputmode="numeric" placeholder="123456" /></div>
    <button onclick="verifyCode()" style="width:100%;">Verify &amp; sign in</button></div>
  <p id="loginMsg" style="color:var(--teal);font-size:12px;"></p>
</div>

<nav id="nav" style="display:none;">
  <div class="logo"><div class="m">CNS</div><div class="t">Material Control</div></div>
  <div id="navItems"></div>
  <div class="who"><b id="whoName"></b><div class="r" id="whoRole"></div></div>
</nav>

<main id="app" style="display:none;">
  <div class="top">
    <div style="display:flex;align-items:baseline;"><h1 id="pageTitle">Overview</h1><span class="sub" id="pageSub"></span></div>
    <div style="display:flex;gap:7px;">
      <button class="g" id="btnQuick" onclick="openQuickLog()" style="display:none;">+ Quick log</button>
      <button class="g" onclick="loadAll()">Refresh</button>
      <button class="g" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="wrap">
    <div class="sitefilter" id="siteFilter"></div>
    <div id="page"></div>
  </div>
</main>

<div class="scrim" id="scrim" onclick="closeOver()"></div>
<div class="over" id="over">
  <div class="oh"><div><h4 id="ovT">Detail</h4><div class="s" id="ovS"></div></div><button class="x" onclick="closeOver()">&times;</button></div>
  <div class="ob" id="ovB"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://scjtiuztvohagvmwgntn.supabase.co';
const SUPA_KEY='sb_publishable_HQ_cM4QKr4D7MNZTseNwbg_j9MmNK8L';
const db=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,C={},CH={},SITE='all',TAB='overview',PERIOD='month',GROUP='site';
const CL={teal:'#02505C',t2:'#4E8D98',t3:'#9CC0C6',sand:'#B08442',s2:'#D8BD91',red:'#B42318',amber:'#B45309',grey:'#D6D3D1',ink:'#1C1917',line:'#E7E5E4',muted:'#78716C'};

const STG={awaiting_file:['Waiting for form','b-amber'],parsing:['Reading form','b-amber'],
  parsed:['Awaiting approval','b-amber'],parse_failed:["Couldn't read form",'b-red'],
  delivery_started:['Delivery in progress','b-teal'],delivered:['Delivered — needs invoice','b-green'],
  invoiced:['Invoiced','b-grey'],closed:['Closed','b-grey'],on_hold:['On hold','b-red']};
const stage=r=>(r.status==='parsed'&&r.approved_at)?['Approved — buy now','b-teal']:(STG[r.status]||[String(r.status||''),'b-grey']);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aed=v=>(v===null||v===undefined||v==='')?'—':Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const aed0=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:0});
const num=v=>(v===null||v===undefined||v==='')?'—':Number(v).toLocaleString();
const ini=n=>String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const fmt=d=>{if(!d)return '—';const x=new Date(d);return x.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+x.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});};
const day=d=>d?new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
function ago(d){if(!d)return '';const s=(Date.now()-new Date(d))/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800);}

/* ---------- roles ----------
   Ambika  master_admin : read + write everything, approvals, overrides
   Sadique ops_manager  : raises invoices, matches them to requests
   Ashik   viewer       : sees every chart and figure, changes nothing        */
const isMD=()=>ME&&ME.role==='master_admin';
const isOps=()=>ME&&ME.role==='ops_manager';
const readOnly=()=>ME&&ME.role==='viewer';

const REDIRECT_TO=location.origin+location.pathname;
async function sendLink(){const e=document.getElementById('loginEmail').value.trim();if(!e)return;
  const {error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:REDIRECT_TO}});
  if(error){document.getElementById('loginMsg').textContent='Error: '+error.message;return;}
  document.getElementById('otpBlock').style.display='block';
  document.getElementById('loginMsg').textContent='Email sent — click the link, or paste the code below.';}
async function verifyCode(){const e=document.getElementById('loginEmail').value.trim(),t=document.getElementById('otpCode').value.trim();
  if(!e||!t)return;let {error}=await db.auth.verifyOtp({email:e,token:t,type:'email'});
  if(error)({error}=await db.auth.verifyOtp({email:e,token:t,type:'magiclink'}));
  if(error){document.getElementById('loginMsg').textContent='Error: '+error.message;return;}location.reload();}
async function signOut(){await db.auth.signOut();location.reload();}

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('loginScreen').style.display='block';
    const h=new URLSearchParams(location.hash.replace(/^#/,''));const d=h.get('error_description');
    if(d)document.getElementById('loginMsg').textContent=decodeURIComponent(d.replace(/\+/g,' '));
    db.auth.onAuthStateChange((_e,s)=>{if(s)location.reload();});return;}
  const {data:me}=await db.from('users').select('*').eq('email',session.user.email).maybeSingle();
  if(!me){document.getElementById('loginScreen').style.display='block';
    document.getElementById('loginMsg').textContent='Signed in as '+session.user.email+' but not on the staff list.';return;}
  ME=me;
  document.getElementById('nav').style.display='flex';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent=me.full_name;
  document.getElementById('whoRole').textContent=({master_admin:'Managing Director',ops_manager:'Manager',viewer:'Read only'})[me.role]||me.role;
  if(isMD()||isOps())document.getElementById('btnQuick').style.display='inline-block';
  loadAll();}

async function loadAll(){
  const q=await Promise.all([
    db.from('projects').select('*'),
    db.from('material_requests').select('*').order('created_at',{ascending:false}).limit(400),
    db.from('request_items').select('*').order('line_no',{ascending:true}),
    db.from('invoices').select('*'), db.from('invoice_items').select('*'),
    db.from('deliveries').select('*'), db.from('delivery_items').select('*'),
    db.from('delivery_photos').select('*'),
    db.from('suppliers').select('*'), db.from('materials').select('*'),
    db.from('lockout_timers').select('*').order('deadline_at',{ascending:true}),
    db.from('alerts').select('*').eq('resolved',false),
    db.from('users').select('id, full_name, phone_e164, is_active, role, is_locked, locked_at')]);
  const g=i=>q[i].data||[];
  C={projects:g(0),requests:g(1),items:g(2),invoices:g(3),iitems:g(4),deliveries:g(5),ditems:g(6),
     photos:g(7),merchants:g(8),materials:g(9),lockouts:g(10),alerts:g(11),users:g(12)};
  C.techs=C.users.filter(u=>u.role==='technician');
  render();}

const pName=id=>(C.projects.find(p=>p.id===id)||{}).name||'Unassigned';
const uName=id=>(C.users.find(u=>u.id===id)||{}).full_name||'Unknown';
const inSite=r=>SITE==='all'||r.project_id===SITE;
function pStart(){const d=new Date();
  if(PERIOD==='month')return new Date(d.getFullYear(),d.getMonth(),1);
  if(PERIOD==='m3'){const x=new Date();x.setMonth(x.getMonth()-3);return x;}
  if(PERIOD==='m6'){const x=new Date();x.setMonth(x.getMonth()-6);return x;}
  return new Date(0);}
const inPeriod=r=>new Date(r.created_at)>=pStart();
const itemsOf=r=>C.items.filter(i=>i.request_id===r.id);
const valOf=rs=>{const s=new Set(rs.map(r=>r.id));return C.items.filter(i=>s.has(i.request_id)).reduce((a,i)=>a+(+i.expected_amount_aed||0),0);};
const invOf=rs=>{const s=new Set(rs.map(r=>r.id));return C.invoices.filter(v=>s.has(v.request_id)).reduce((a,v)=>a+(+v.total_amount_aed||0),0);};
const pending=()=>C.requests.filter(r=>!r.approved_at&&['parsed','parsing'].includes(r.status));

/* ---------- checks ---------- */
function dupRequests(){
  const out=[],seen={},rb={};C.requests.forEach(r=>rb[r.id]=r);
  C.items.forEach(i=>{const r=rb[i.request_id];if(!r)return;
    const k=(r.project_id||'')+'|'+String(i.raw_name||'').trim().toLowerCase();(seen[k]=seen[k]||[]).push({r,i});});
  Object.values(seen).forEach(l=>{if(l.length<2)return;
    l.sort((a,b)=>new Date(a.r.created_at)-new Date(b.r.created_at));
    for(let n=1;n<l.length;n++){const g=(new Date(l[n].r.created_at)-new Date(l[n-1].r.created_at))/864e5;
      if(g<=14)out.push({site:pName(l[n].r.project_id),material:l[n].i.raw_name,days:Math.round(g),
        tech:uName(l[n].r.technician_id),value:+l[n].i.expected_amount_aed||0,id:l[n].r.id,
        firstDate:l[n-1].r.created_at,secondDate:l[n].r.created_at});}});
  return out;}
function invoiceProblems(){
  const out=[],rb={};C.requests.forEach(r=>rb[r.id]=r);
  const bySig={};
  C.invoices.forEach(v=>{
    const r=rb[v.request_id];
    const d=new Date(v.submitted_at);
    if(r&&d<new Date(r.created_at))
      out.push({t:'Dated before the request',v,detail:'Invoice '+day(v.submitted_at)+' is earlier than the request '+day(r.created_at)});
    if(d>new Date(Date.now()+864e5))
      out.push({t:'Dated in the future',v,detail:'Invoice dated '+day(v.submitted_at)});
    const sig=v.request_id+'|'+v.supplier_id+'|'+Number(v.total_amount_aed).toFixed(2);
    (bySig[sig]=bySig[sig]||[]).push(v);});
  Object.values(bySig).forEach(l=>{if(l.length>1)
    out.push({t:'Possible duplicate invoice',v:l[1],detail:l.length+' invoices with the same request, merchant and amount'});});
  return out;}
function dupPhotos(){
  const by={};C.photos.forEach(p=>{const k=String(p.wa_media_id||p.storage_path||'').trim();if(!k)return;(by[k]=by[k]||[]).push(p);});
  return Object.values(by).filter(l=>l.length>1).map(l=>({key:l[0].wa_media_id||l[0].storage_path,n:l.length,photos:l}));}

/* ---------- nav ---------- */
const TABS=[
  {k:'overview',t:'Overview'},
  {k:'approvals',t:'Approvals',md:true,count:()=>pending().length},
  {k:'requests',t:'Requests'},
  {k:'spend',t:'Spend'},
  {k:'materials',t:'Materials'},
  {k:'invoices',t:'Invoices',ops:true},
  {k:'checks',t:'Checks',count:()=>dupRequests().length+invoiceProblems().length+dupPhotos().length+(C.alerts||[]).length},
  {k:'merchants',t:'Merchants'},
  {k:'admin',t:'Manual overrides',mdOnly:true}];
function renderNav(){
  const el=document.getElementById('navItems');
  el.innerHTML='<div class="navsec">Daily</div>'+
    TABS.filter(t=>['overview','approvals','requests'].includes(t.k)).map(navItem).join('')+
    '<div class="navsec">Money</div>'+
    TABS.filter(t=>['spend','invoices','merchants'].includes(t.k)).map(navItem).join('')+
    '<div class="navsec">Control</div>'+

/* A blocked update is NOT an error in PostgREST — the row simply falls outside the
   policy, so you get success with zero rows back. Without .select() and this check
   the portal happily reports "saved" while nothing changed. Every write goes
   through here. */
async function saveRow(q,what){
  const {data,error}=await q.select();
  if(error){toast('Could not save '+what+': '+error.message);return false;}
  if(!data||!data.length){toast('Not saved — you do not have permission to change '+what);return false;}
  return true;}

async function approve(id){
  if(!isMD()){toast('Only the Managing Director approves requests');return;}
  const ok=await saveRow(db.from('material_requests').update({approved_at:new Date().toISOString(),approved_by:ME.id}).eq('id',id),'this approval');
  if(!ok)return;
  toast('Approved — now with Sadique for invoicing');closeOver();loadAll();}

   made this fail with a duplicate-key error on names that already existed. */
async function findOrAdd(table,col,value){
  const hit=await db.from(table).select('*').ilike(col,value).limit(1);
  if(hit.error)throw hit.error;
  if(hit.data&&hit.data.length)return hit.data[0];
  const ins=await db.from(table).insert({[col]:value}).select().single();
  if(!ins.error)return ins.data;
  if(ins.error.code==='23505'){                       // someone else added it first
    const again=await db.from(table).select('*').ilike(col,value).limit(1);
    if(again.data&&again.data.length)return again.data[0];}
  throw ins.error;}

async function saveInvoice(){
  const msg=document.getElementById('ivMsg');
  try{
    if(readOnly())throw new Error('read-only access');
    const rid=document.getElementById('ivReq').value;if(!rid)throw new Error('pick the request this belongs to');
    const req=C.requests.find(r=>r.id===rid);
    const dstr=document.getElementById('ivDate').value;if(!dstr)throw new Error('enter the invoice date');
    const d=new Date(dstr+'T12:00:00');
    if(req&&d<new Date(new Date(req.created_at).toDateString()))
      throw new Error('invoice is dated before the request was raised ('+day(req.created_at)+')');
    if(d>new Date(Date.now()+864e5))throw new Error('invoice cannot be dated in the future');
    const mn=document.getElementById('ivMerch').value.trim();if(!mn)throw new Error('merchant name required');
    const m=await findOrAdd('suppliers','name',mn);
    const lines=[];
    for(const row of document.querySelectorAll('#ivItems .row3')){
      const n=row.querySelector('.v-n').value.trim().toLowerCase();
      const q=+row.querySelector('.v-q').value,p=+row.querySelector('.v-p').value;
      if(!n||!q||!p)continue;
      const mat=await findOrAdd('materials','canonical_name',n);
      lines.push({material_id:mat.id,qty:q,unit_price_aed:p});}
    if(!lines.length)throw new Error('add at least one complete line');
    const total=ivTot();
    const dup=C.invoices.find(v=>v.request_id===rid&&v.supplier_id===m.id&&Math.abs(+v.total_amount_aed-total)<0.01);
    if(dup&&!confirm('An invoice for this request, merchant and amount already exists. Save anyway?'))return;
    /* Upload the invoice image before writing the row, so the row never points
       at a file that failed to arrive. */
    let receiptPath='receipts/pending';
    const f=document.getElementById('ivFile').files[0];
    if(f){
      if(f.size>15*1024*1024)throw new Error('that file is over 15 MB');
      msg.textContent='Uploading the invoice…';
      const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-60);
      receiptPath=rid+'/'+Date.now()+'-'+safe;
      const up=await db.storage.from('receipts').upload(receiptPath,f,{contentType:f.type||undefined});
      if(up.error)throw up.error;}

    const inv=await db.from('invoices').insert({request_id:rid,supplier_id:m.id,submitted_by:ME.id,
      receipt_file_path:receiptPath,
      total_amount_aed:total,submitted_at:d.toISOString()}).select().single();
    if(inv.error)throw inv.error;
    const it=await db.from('invoice_items').insert(lines.map(l=>({...l,invoice_id:inv.data.id})));
    if(it.error)throw it.error;
    msg.textContent='Saved ✓';toast('Invoice matched to the request');loadAll();
  }catch(e){msg.textContent='Error: '+(e.message||e);}}

/* Pull the camera's own timestamp out of a JPEG's EXIF block. This is stored
   separately from uploaded_at on purpose: uploaded_at only says when it reached
   us, which a technician controls. taken_at is what the camera recorded, and a
   photo taken before the request even existed cannot be of that delivery. */
async function exifTakenAt(file){
  try{
    if(!/^image\/jpe?g$/i.test(file.type||''))return null;
    const buf=new Uint8Array(await file.slice(0,256*1024).arrayBuffer());
    if(buf[0]!==0xFF||buf[1]!==0xD8)return null;
    let o=2;
    while(o<buf.length-4){
      if(buf[o]!==0xFF){o++;continue;}
      const marker=buf[o+1],size=(buf[o+2]<<8)|buf[o+3];
      if(marker===0xE1&&String.fromCharCode(buf[o+4],buf[o+5],buf[o+6],buf[o+7])==='Exif'){
        const tiff=o+10,little=buf[tiff]===0x49;
        const u16=p=>little?(buf[p]|(buf[p+1]<<8)):((buf[p]<<8)|buf[p+1]);
        const u32=p=>(little?(buf[p]|(buf[p+1]<<8)|(buf[p+2]<<16)|(buf[p+3]<<24))
                            :((buf[p]<<24)|(buf[p+1]<<16)|(buf[p+2]<<8)|buf[p+3]))>>>0;
        const readIFD=off=>{
          const n=u16(off);
          for(let i=0;i<n;i++){
            const e=off+2+i*12,tag=u16(e);
            if(tag===0x8769){const s=readIFD(tiff+u32(e+8));if(s)return s;}
            if(tag===0x9003||tag===0x9004||tag===0x0132){
              const vo=tiff+u32(e+8);let s='';
              for(let k=0;k<19;k++)s+=String.fromCharCode(buf[vo+k]);
              if(/^\d{4}:\d{2}:\d{2} \d{2}:\d{2}:\d{2}/.test(s))return s;}}
          return null;};
        const s=readIFD(tiff+u32(tiff+4));
        if(s){const d=new Date(s.slice(0,10).replace(/:/g,'-')+'T'+s.slice(11,19));
          if(!isNaN(d))return d.toISOString();}
        return null;}
      if(marker===0x01||(marker>=0xD0&&marker<=0xD9)){o+=2;continue;}
      o+=2+size;}
  }catch(e){}
  return null;}

function uploadBox(reqId){
  if(readOnly())return '';
  return '<div class="drop"><label>Attach a file to this request</label>'+
    '<div style="display:flex;gap:6px;align-items:center;">'+
      '<select id="upKind" style="flex:1;">'+BUCKETS.map(b=>'<option value="'+b[0]+'">'+b[1]+'</option>').join('')+'</select>'+
      '<input type="file" id="upFile" style="flex:2;padding:4px;" accept="image/*,.pdf" />'+
      '<button class="sm" onclick="doUpload(\''+reqId+'\')">Upload</button></div>'+
    '<div id="upMsg" style="font-size:11px;color:var(--teal);margin-top:6px;"></div>'+
    '<div class="fs" style="font-size:10.5px;color:var(--faint);margin-top:4px;">'+
      'Photos of a delivery should show the timestamp. Up to 15 MB.</div></div>';}

async function doUpload(reqId){
  const m=document.getElementById('upMsg');
  try{
    const bucket=document.getElementById('upKind').value;
    const f=document.getElementById('upFile').files[0];
    if(!f)throw new Error('choose a file first');
    if(f.size>15*1024*1024)throw new Error('that file is over 15 MB');
    m.textContent='Uploading…';
    const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-60);
    const path=reqId+'/'+Date.now()+'-'+safe;
    const up=await db.storage.from(bucket).upload(path,f,{contentType:f.type||undefined});
    if(up.error)throw up.error;

    /* The file is in storage; now point the right row at it, so it shows up
       against this request rather than floating unattached in a bucket. */
    if(bucket==='requests'){
      if(!await saveRow(db.from('material_requests').update({raw_file_path:path}).eq('id',reqId),'this request'))return;
    }else if(bucket==='receipts'){
      const inv=C.invoices.find(v=>v.request_id===reqId);
      if(!inv)throw new Error('there is no invoice on this request yet — raise it in the Invoices tab first');
      if(!await saveRow(db.from('invoices').update({receipt_file_path:path}).eq('id',inv.id),'this invoice'))return;
    }else{
      const r=C.requests.find(x=>x.id===reqId);
      let d=C.deliveries.find(x=>x.request_id===reqId);
      if(!d){
        const ins=await db.from('deliveries').insert({request_id:reqId,technician_id:r.technician_id,
          started_at:new Date().toISOString()}).select().single();
        if(ins.error)throw ins.error; d=ins.data;}
      const taken=await exifTakenAt(f);
      const ph=await db.from('delivery_photos').insert({delivery_id:d.id,storage_path:path,
        uploaded_at:new Date().toISOString(),
        taken_at:taken, taken_at_source:taken?'exif':null});
      if(ph.error)throw ph.error;
      if(!taken)toast('Uploaded — but this photo carries no camera timestamp');}

    m.textContent='Uploaded ✓';toast('File attached');
    await loadAll();openReq(reqId);
  }catch(e){m.textContent='Error: '+(e.message||e);}}

async function openReq(id){
  const r=C.requests.find(x=>x.id===id);if(!r)return;
  const its=itemsOf(r),v=valOf([r]),b=invOf([r]),[t,c]=stage(r);
  const dm={};C.ditems.forEach(d=>dm[d.request_item_id]=d);
  const dels=C.deliveries.filter(d=>d.request_id===r.id);
  const photos=C.photos.filter(p=>dels.some(d=>d.id===p.delivery_id));
  const invs=C.invoices.filter(x=>x.request_id===r.id);
  const projReqs=C.requests.filter(x=>x.project_id===r.project_id);
  const techReqs=C.requests.filter(x=>x.technician_id===r.technician_id).filter(x=>x.id!==r.id).slice(0,3);
  const bud=+((C.projects.find(p=>p.id===r.project_id)||{}).material_budget_aed)||0;
  const spent=valOf(projReqs);
  const rows=its.map(i=>{const d=dm[i.id],got=d?+d.received_qty:null;
    const vr=d&&+d.qty_variance!==0?' <span class="b b-red">'+(+d.qty_variance>0?'+':'')+d.qty_variance+'</span>':'';
    return '<tr><td class="n">'+(i.line_no??'—')+'</td><td>'+esc(i.raw_name)+'</td><td class="n">'+num(i.requested_qty)+'</td>'+
      '<td class="n">'+(got==null?'<span style="color:var(--faint)">—</span>':num(got)+vr)+'</td>'+
      '<td>'+esc(i.unit||'')+'</td><td class="n">'+aed(i.expected_amount_aed)+'</td></tr>';}).join('');
  openOver(esc(pName(r.project_id)),
    esc(uName(r.technician_id))+' · '+fmt(r.created_at)+' · <span class="b '+c+'">'+esc(t)+'</span>',
    '<div class="grid g2" style="gap:10px;margin-bottom:14px;">'+
      st('Ordered',aed(v),its.length+' lines')+st('Invoiced',b?aed(b):'—',invs.length+' invoice'+(invs.length===1?'':'s'))+'</div>'+
    (isMD()&&!r.approved_at&&['parsed','parsing'].includes(r.status)
      ? '<button class="ok" style="width:100%;margin-bottom:14px;" onclick="approve(\''+r.id+'\')">Approve — sends it to Sadique</button>' : '')+
    (r.approved_at?'<div class="note" style="margin:0 0 12px;"><b>Approved</b> '+fmt(r.approved_at)+' by '+esc(uName(r.approved_by))+'</div>':'')+
    '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin:14px 0 7px;">Site context</div>'+
    '<table><tbody>'+
      '<tr><td>Total ever ordered on '+esc(pName(r.project_id))+'</td><td class="n"><b>'+aed(spent)+'</b></td></tr>'+
      '<tr><td>Budget</td><td class="n">'+(bud?aed(bud)+' · '+Math.round(spent/bud*100)+'% used':'not set')+'</td></tr>'+
      '<tr><td>Requests on this site</td><td class="n">'+projReqs.length+'</td></tr>'+
      '<tr><td><a class="lnk" onclick="closeOver();SITE=\''+r.project_id+'\';go(\'spend\')">Open this site in Spend explorer →</a></td><td></td></tr>'+
      '<tr><td><a class="lnk" onclick="closeOver();SITE=\''+r.project_id+'\';go(\'requests\')">See every request on this site →</a></td><td></td></tr>'+
    '</tbody></table>'+
    (techReqs.length?'<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin:16px 0 7px;">'+
      esc(uName(r.technician_id))+'&rsquo;s recent requests</div><table><tbody>'+
      techReqs.map(x=>'<tr class="cr" onclick="openReq(\''+x.id+'\')"><td>'+esc(pName(x.project_id))+'</td>'+
        '<td>'+day(x.created_at)+'</td><td class="n">'+aed0(valOf([x]))+'</td></tr>').join('')+'</tbody></table>':'')+
    '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin:16px 0 7px;">Materials</div>'+
    (its.length?'<table><thead><tr><th class="n">#</th><th>Material</th><th class="n">Ordered</th><th class="n">Received</th><th>Unit</th><th class="n">AED</th></tr></thead><tbody>'+rows+'</tbody></table>'
      :'<div class="empty">Nothing read from this request yet.</div>')+
    '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin:16px 0 7px;">Files</div>'+
    '<div id="ovFiles" style="font-size:12px;line-height:2;">loading…</div>'+
    (r.note?'<div class="note"><b>Note.</b> '+esc(r.note)+'</div>':''));
  const parts=[];
  parts.push(await fileCard('requests',r.raw_file_path,'Request form',
    'sent by '+uName(r.technician_id)+' · '+fmt(r.created_at)));
  for(const p of photos){
    /* taken_at is the camera's own clock. If it predates the request, the photo
       cannot be of this delivery — that is the reused-photo case. */
    const stale=p.taken_at&&new Date(p.taken_at)<new Date(r.created_at);
    const when=p.taken_at?('taken '+fmt(p.taken_at)):'no camera timestamp';
    parts.push(await fileCard('delivery-photos',p.storage_path,
      'Delivery photo'+(stale?' — taken before the request':'')+(!p.taken_at?' — unverified':''),
      when+' · uploaded '+fmt(p.uploaded_at)));}
  for(const v2 of invs)parts.push(await fileCard('receipts',v2.receipt_file_path,'Merchant invoice',
    aed(v2.total_amount_aed)+' AED · '+day(v2.submitted_at)));
  const el=document.getElementById('ovFiles');
  if(el)el.innerHTML=(parts.filter(Boolean).join('')||
    '<div class="fs" style="color:var(--faint);padding:6px 0;">Nothing attached yet.</div>')+uploadBox(r.id);}

/* ---------- quick log ---------- */
function openQuickLog(){
  if(readOnly())return;
  openOver('Quick log','Attribute a purchase or a phoned-in request to a site and technician.',
    '<div class="fld"><label>Site</label><select id="qSite">'+C.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Technician</label><select id="qTech">'+C.techs.map(t=>'<option value="'+t.id+'">'+esc(t.full_name)+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>What is this?</label><select id="qKind">'+
      '<option value="bought">Already bought</option><option value="request">A request phoned in</option></select></div>'+
    '<div class="fld"><label>Materials</label><div id="qItems"></div><button class="g sm" onclick="qAdd()">+ Add line</button></div>'+
    '<div class="fld"><label>Note</label><textarea id="qNote" rows="2" placeholder="e.g. bought from Al Aweer, cash"></textarea></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0;">'+
      '<span>Total: <b id="qTot">0.00</b> AED</span><button onclick="saveQuick()">Save</button></div>'+
    '<p id="qMsg" style="font-size:11.5px;color:var(--teal);"></p>');
  qAdd();}
function qAdd(){const d=document.createElement('div');d.className='row3';
  d.innerHTML='<input placeholder="material" class="q-n" /><input type="number" step="0.01" placeholder="qty" class="q-q" />'+
    '<input type="number" step="0.01" placeholder="AED" class="q-v" oninput="qTot()" />'+
    '<button class="g sm" onclick="this.parentNode.remove();qTot()">&times;</button>';
  document.getElementById('qItems').appendChild(d);}
function qTot(){let t=0;document.querySelectorAll('#qItems .row3').forEach(r=>t+=(+r.querySelector('.q-v').value||0));
  const e=document.getElementById('qTot');if(e)e.textContent=t.toFixed(2);return t;}
async function saveQuick(){
  const m=document.getElementById('qMsg');
  try{
    const s=document.getElementById('qSite').value,t=document.getElementById('qTech').value;
    const k=document.getElementById('qKind').value,n=document.getElementById('qNote').value.trim();
    const lines=[];let i=0;
    document.querySelectorAll('#qItems .row3').forEach(r=>{const nm=r.querySelector('.q-n').value.trim();
      if(!nm)return;i++;lines.push({raw_name:nm,requested_qty:+r.querySelector('.q-q').value||null,
        expected_amount_aed:+r.querySelector('.q-v').value||null,unit:'',line_no:i});});
    if(!lines.length)throw new Error('add at least one material');
    const req=await db.from('material_requests').insert({project_id:s,technician_id:t,
      status:k==='bought'?'delivered':'parsed',logged_manually:true,note:n||null,
      approved_at:k==='bought'?new Date().toISOString():null,approved_by:k==='bought'?ME.id:null}).select().single();
    if(req.error)throw req.error;
    const ins=await db.from('request_items').insert(lines.map(l=>({...l,request_id:req.data.id})));
    if(ins.error)throw ins.error;
    m.textContent='Saved ✓';toast('Logged against '+pName(s));setTimeout(()=>{closeOver();loadAll();},600);
  }catch(e){m.textContent='Error: '+(e.message||e);}}

boot();
</script>
